; PlatformIO Project Configuration File for ESP32 Headless Smart Coffee Scale
; Framework: Arduino
; Target Board: ESP32-C3 SuperMini (esp32-c3-devkitm-1)
; BLE Protocol: Decent Scale (Beanconqueror Compatible)

[platformio]
default_envs = esp32-c3-devkitm-1
src_dir = src

[env:esp32-c3-devkitm-1]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    default
    colorize

; Upload Settings
upload_speed = 921600

; Partition table: min_spiffs allocates ~1.9MB for application firmware
; Essential for accommodating the ESP32 BLE stack alongside NVS and FreeRTOS
board_build.partitions = min_spiffs.csv

; Build Flags:
; - Enable native USB-CDC Serial on ESP32-C3
; - Enable compiler optimizations
; - Set core debug level (0 = None, 1 = Error, 3 = Info)
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -O2

; External Library Dependencies
lib_deps = 
    bogde/HX711 @ ^0.7.5
